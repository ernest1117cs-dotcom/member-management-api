version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: jdbc-mysql
    environment:
      MYSQL_DATABASE: member_db
      MYSQL_ROOT_PASSWORD: root
    ports:
    - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v3/api-docs > /dev/null || exit 1"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jdbc-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/member_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Taipei
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_SQL_INIT_MODE: always
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/members > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql-data: